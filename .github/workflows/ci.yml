# Runs on every push and pull request: Flutter analyze + tests, Worker tests + bundle check.
name: CI

on:
  push:
    branches: [main, bilge-changes]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      # Every issue becomes a GitHub annotation on the exact line; errors and
      # warnings fail the job, style infos are shown but don't block.
      - name: Analyze
        run: |
          set +e
          dart analyze --format=machine > analyze.txt 2>&1
          status=$?
          awk -F'|' 'NF >= 8 {
            level = ($1 == "ERROR") ? "error" : ($1 == "WARNING") ? "warning" : "notice"
            printf "::%s file=%s,line=%s,col=%s::%s (%s)\n", level, $4, $5, $6, $8, tolower($3)
          }' analyze.txt | sed "s#file=$PWD/#file=#"
          echo "Analyzer exit code: $status"
          exit $status

      - name: Test
        run: flutter test --reporter=github

  worker:
    name: Worker test & bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Test
        run: npm test

      # Builds the Worker exactly like a deploy would, without uploading it.
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir dist
