# Fridgenie API Worker. Secrets (never commit them):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put APP_TOKEN
# For local dev, copy .dev.vars.example to .dev.vars and fill in the same values.

name = "fridgenie-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Pinned model id; change here to upgrade without touching code.
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Comma-separated web origins allowed by CORS (native apps need none), e.g. "https://fridgenie.app".
ALLOWED_ORIGINS = ""
# Per-device requests per UTC day; only enforced when QUOTA_KV below is set up.
DAILY_SCAN_QUOTA = "40"
DAILY_RECIPES_QUOTA = "120"

# Optional daily-quota storage. To turn it on:
#   npx wrangler kv namespace create QUOTA_KV
# then paste the printed id below, uncomment, and redeploy. Without it the
# Worker still runs; only the per-minute limits apply.
# [[kv_namespaces]]
# binding = "QUOTA_KV"
# id = "<paste the id printed by the create command>"

[observability]
enabled = true

# Per-client limits (key = device id or IP). namespace_id must be unique within the Cloudflare account.
[[ratelimits]]
name = "SCAN_RATE_LIMITER"
namespace_id = "1101"

  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "RECIPE_RATE_LIMITER"
namespace_id = "1102"

  [ratelimits.simple]
  limit = 10
  period = 60
