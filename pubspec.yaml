name: fridgenie
description: "Fridgenie — your AI-powered smart cooking companion. Turn ingredients into ideas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Beautiful, food-tech typography
  google_fonts: ^6.2.1

  # Persist onboarding state + taste profile
  shared_preferences: ^2.3.2

  # Real fridge photo capture (camera + library)
  image_picker: ^1.1.2

  # Talk to AI vision APIs (OpenAI / Anthropic) over HTTPS
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  background_color_ios: "#F3F4F7"
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/badges/